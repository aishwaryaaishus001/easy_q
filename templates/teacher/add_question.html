<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Question - Easy Q</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 flex justify-center py-12">

<div class="w-full max-w-xl">
    <!-- 🔓 Logout Button -->
    <div class="flex justify-end mb-4">
      <a href="{% url 'teacher-logout' %}" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded shadow">
        Logout
      </a>
    </div>

  <form method="POST" action="{% url 'add-question' %}" class="bg-white p-8 rounded shadow-md w-full max-w-xl" id="questionForm">
    {% csrf_token %}
    <h2 class="text-2xl font-bold mb-6 text-center">Add a New Question</h2>

    {% if messages %}
      {% for message in messages %}
        {% if message|stringformat:"s" == "Question added successfully." %}
          <p class="text-green-600 mb-4">{{ message }}</p>
        {% else %}  
          <p class="text-red-600 mb-4">{{ message }}</p>
        {% endif %}  
      {% endfor %}
    {% endif %}
    <!-- Paper Selection -->
    <select name="paper" class="w-full px-4 py-2 border rounded mb-4" required>
      <option value="">Select Paper</option>
      {% for p in papers %}
        <option value="{{ p }}">{{ p }}</option>
      {% endfor %}
    </select>
    <!-- Question Text -->
    <textarea name="text" id="questionText" rows="4" placeholder="Enter the question here" class="w-full px-4 py-2 border rounded mb-4" required></textarea>

    <!-- Module -->
    <input type="text" name="module" id="moduleInput" placeholder="Module Number" class="w-full px-4 py-2 border rounded mb-4" required>


    <!-- Predict Button -->
    <button type="button" id="predictBtn" class="w-full bg-yellow-500 text-white py-2 rounded hover:bg-yellow-600 mb-4">Predict Difficulty</button>

    <!-- Predicted Fields: Hidden Initially -->
    <div id="predictionResult" class="hidden">
      <!--input type="number" name="mark" id="markField" class="w-full px-4 py-2 border rounded mb-4 bg-gray-100" readonly-->

      <input type="text" name="difficulty" id="difficultyField" class="w-full px-4 py-2 border rounded mb-4 bg-gray-100" readonly>
      <input type="hidden" name="cluster_label" id="clusterLabelField">
      <input type="hidden" name="embedding" id="embeddingField">


      <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">Add Question</button>
    </div>
  </form>

  <script>
    document.getElementById('predictBtn').addEventListener('click', function () {
      const question = document.getElementById('questionText').value.trim();
      const module = document.getElementById('moduleInput').value.trim();
      const paper = document.querySelector('select[name="paper"]').value;

      if (!question || !module || !paper) {
        alert('Please enter both question, module and paper.');
        return;
      }

      // 🔁 Replace with your actual prediction endpoint
      axios.post("{% url 'predict-difficulty' %}", {
        text: question,
        module: module,
        paper: paper
      })
      .then(response => {
        const data = response.data;

        // Assuming the backend returns { difficulty: 'easy', mark: 4 }
        document.getElementById('difficultyField').value = data.difficulty;

        // Save other things like cluster label and embedding in hidden fields
        document.getElementById('clusterLabelField').value = data.cluster_label;
        document.getElementById('embeddingField').value = JSON.stringify(data.embedding);
        //document.getElementById('markField').value = data.mark;

        // Show the predicted fields
        document.getElementById('predictionResult').classList.remove('hidden');
      })
      .catch(error => {
        console.error('Prediction error:', error);
        alert('Failed to predict difficulty. Please try again.');
      });
    });
  </script>

</body>
</html>
