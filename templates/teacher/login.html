<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Login - Easy Q</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center h-screen">

  <form method="POST" class="bg-white p-8 rounded shadow-md w-96">
    {% csrf_token %}
    <h2 class="text-2xl font-bold mb-6 text-center">Teacher Login</h2>

    {% if messages %}
      {% for message in messages %}
        <p class="text-red-600 mb-4">{{ message }}</p>
      {% endfor %}
    {% endif %}

    <input type="text" name="username" placeholder="Username" class="w-full px-4 py-2 border rounded mb-4" required>
    <input type="password" name="password" placeholder="Password" class="w-full px-4 py-2 border rounded mb-6" required>

    <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">Login</button>
  </form>

</body>
</html>
